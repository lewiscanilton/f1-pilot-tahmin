<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Pit Stop Refleks Testi</title>
    <!-- Supabase JavaScript Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                linear-gradient(90deg, rgba(225,6,0,0.03) 1px, transparent 1px),
                linear-gradient(0deg, rgba(225,6,0,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .container {
            background: #181818;
            padding: 40px;
            border-radius: 14px;
            border-top: 4px solid #f1c40f;
            border-bottom: 4px solid #f1c40f;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #fff;
        }

        p {
            color: #888;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        /* F1 Start Işıkları Paneli */
        .f1-lights-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: #0a0a0a;
            padding: 15px 25px;
            border-radius: 40px;
            border: 2px solid #333;
            margin-bottom: 30px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .f1-bulb {
            width: 25px;
            height: 25px;
            background-color: #222;
            border-radius: 50%;
            border: 2px solid #444;
            transition: background-color 0.1s, box-shadow 0.1s;
        }

        .f1-bulb.active {
            background-color: #e10600;
            box-shadow: 0 0 15px #e10600;
            border-color: #ff3333;
        }

        .f1-bulb.green {
            background-color: #2ecc71 !important;
            box-shadow: 0 0 20px #2ecc71 !important;
            border-color: #55efc4 !important;
        }

        /* Aksiyon Butonu */
        #reaction-btn {
            width: 100%;
            padding: 25px;
            font-size: 1.4rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 1px;
        }

        .btn-ready {
            background-color: #e10600;
            color: white;
        }
        .btn-ready:hover {
            background-color: #b50500;
            box-shadow: 0 0 20px rgba(225,6,0,0.6);
        }

        .btn-wait {
            background-color: #333;
            color: #777;
            cursor: not-allowed !important;
        }

        .btn-click {
            background-color: #2ecc71;
            color: #121212;
            box-shadow: 0 0 25px rgba(46,204,113,0.8);
        }

        /* Sonuç Ekranı */
        #result-display {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #f1c40f;
            min-height: 30px;
        }

        .leaderboard-section {
            margin-top: 30px;
            border-top: 1px solid #333;
            padding-top: 20px;
            text-align: left;
        }

        .leaderboard-section h3 {
            font-size: 1.1rem;
            color: #f1c40f;
            text-transform: uppercase;
            font-style: italic;
            margin-bottom: 15px;
            text-align: center;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            padding: 8px 10px;
            border-bottom: 1px solid #222;
            color: #ccc;
        }

        .score-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pit Stop Refleks</h1>
        <p>Işıklar söndüğü andaki refleksini ölç ve liderlik tablosuna adını yazdır!</p>

        <!-- 5'li F1 Başlangıç Işıkları -->
        <div class="f1-lights-box">
            <div class="f1-bulb" id="b1"></div>
            <div class="f1-bulb" id="b2"></div>
            <div class="f1-bulb" id="b3"></div>
            <div class="f1-bulb" id="b4"></div>
            <div class="f1-bulb" id="b5"></div>
        </div>

        <button id="reaction-btn" class="btn-ready" onclick="butonTiklandi()">OYUNA BAŞLA</button>

        <div id="result-display"></div>

        <div class="leaderboard-section">
            <h3>⚡ En Hızlı Refleksler (Liderlik Tablosu)</h3>
            <div id="refleks-score-list">Yükleniyor...</div>
        </div>
    </div>

    <script>
        // --- SUPABASE BAĞLANTI AYARLARI ---
        const SUPABASE_URL = 'https://kdcwqlupryvncklvosys.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_aL2K54pYu4aNmh9CxKnyKg_Xf1BmFQQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let oyunDurumu = "BASLANGIC"; // BASLANGIC, BEKLEME, YESIL, BITTI
        let baslangicZamani = 0;
        let zamanlayici = null;
        let aktifKullanici = localStorage.getItem('f1_nickname') || "Pilot";

        const btn = document.getElementById('reaction-btn');
        const resultDisplay = document.getElementById('result-display');
        const bulbs = [
            document.getElementById('b1'),
            document.getElementById('b2'),
            document.getElementById('b3'),
            document.getElementById('b4'),
            document.getElementById('b5')
        ];

        // --- WEB AUDIO API İLE F1 SES EFEKTLERİ ---
        let audioCtx = null;

        function sesCal(frekans, sure) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = frekans; // Ses kalınlığı/inceliği
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + sure);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + sure);
            } catch (e) {
                // Tarayıcı ses engeline takılırsa sessizce devam eder
            }
        }

        window.onload = function() {
            refleksSkorlariniGetir();
            canliRefleksDinle();
        };

        function butonTiklandi() {
            if (oyunDurumu === "BASLANGIC" || oyunDurumu === "BITTI") {
                seriyiBaslat();
            } else if (oyunDurumu === "BEKLEME") {
                // Erken basma cezası (False Start)
                clearTimeout(zamanlayici);
                isiklariSifirla();
                resultDisplay.innerHTML = "<span style='color:#e10600;'>FALSE START! Çok erken bastın!</span>";
                btn.textContent = "TEKRAR DENE";
                btn.className = "btn-ready";
                oyunDurumu = "BITTI";
            } else if (oyunDurumu === "YESIL") {
                // Doğru an! Süreyi hesapla
                let bitisZamani = performance.now();
                let sure = parseFloat(((bitisZamani - baslangicZamani) / 1000).toFixed(3));

                isiklariSifirla();
                resultDisplay.innerHTML = `Süren: <span style="color:#2ecc71;">${sure} saniye</span>`;
                btn.textContent = "TEKRAR DENE";
                btn.className = "btn-ready";
                oyunDurumu = "BITTI";

                refleksSkorKaydet(sure);
            }
        }

        function seriyiBaslat() {
            resultDisplay.textContent = "Işıklar yanıyor...";
            btn.textContent = "BEKLE...";
            btn.className = "btn-wait";
            oyunDurumu = "BEKLEME";

            isiklariSifirla();

            let aktifIndex = 0;
            let isikInterval = setInterval(() => {
                if (aktifIndex < 5) {
                    bulbs[aktifIndex].classList.add('active');
                    sesCal(440, 0.15); // Her kırmızı ışıkta kısa "bip" sesi (440 Hz)
                    aktifIndex++;
                } else {
                    clearInterval(isikInterval);
                    
                    // 1.2 ile 3.2 saniye arası rastgele bir sürede ışıkları söndür
                    let rastgeleBekleme = Math.floor(Math.random() * 2000) + 1200;
                    zamanlayici = setTimeout(() => {
                        isiklariSifirla();
                        sesCal(880, 0.3); // Bütün ışıklar söndüğünde tık/başlangıç tok "biip" sesi (İnce 880 Hz)
                        
                        baslangicZamani = performance.now();
                        btn.textContent = "ŞİMDİ BAS!";
                        btn.className = "btn-click";
                        oyunDurumu = "YESIL";
                    }, rastgeleBekleme);
                }
            }, 1000); // Her 1 saniyede bir bir kırmızı lamba yanar
        }

        function isiklariSifirla() {
            bulbs.forEach(b => {
                b.classList.remove('active');
                b.classList.remove('green');
            });
        }

        // --- SUPABASE SKOR KAYIT VE LİDERLİK TABLOSU ---
        async function refleksSkorKaydet(sure) {
            try {
                const { data: mevcutlar } = await _supabase
                    .from('refleks_skorlari')
                    .select('sure')
                    .eq('kullanici', aktifKullanici);

                if (mevcutlar && mevcutlar.length > 0) {
                    // Eğer yeni yaptığı süre daha düşükse (daha hızlıysa) güncelle
                    if (sure < mevcutlar[0].sure) {
                        await _supabase
                            .from('refleks_skorlari')
                            .update({ sure: sure })
                            .eq('kullanici', aktifKullanici);
                    }
                } else {
                    await _supabase
                        .from('refleks_skorlari')
                        .insert([{ kullanici: aktifKullanici, sure: sure }]);
                }
                refleksSkorlariniGetir();
            } catch (err) {
                console.error("Refleks kayıt hatası:", err);
            }
        }

        async function refleksSkorlariniGetir() {
            const listContainer = document.getElementById('refleks-score-list');
            try {
                const { data, error } = await _supabase
                    .from('refleks_skorlari')
                    .select('*')
                    .order('sure', { ascending: true }) // En düşük süre en iyidir
                    .limit(5);

                if (error) {
                    listContainer.innerHTML = '<div style="color:#777; text-align:center;">Tablo bulunamadı. Lütfen Supabase\'de "refleks_skorlari" tablosu açın.</div>';
                    return;
                }

                if (!data || data.length === 0) {
                    listContainer.innerHTML = '<div style="color:#777; text-align:center;">Henüz skor yok. İlk sen ol!</div>';
                    return;
                }

                listContainer.innerHTML = '';
                data.forEach((row, index) => {
                    listContainer.innerHTML += `
                        <div class="score-row">
                            <span><b>${index + 1}.</b> ${row.kullanici}</span>
                            <span style="color: #2ecc71; font-weight: bold;">${row.sure} sn</span>
                        </div>
                    `;
                });
            } catch (err) {
                listContainer.innerHTML = '<div style="color:#777; text-align:center;">Bağlantı hatası.</div>';
            }
        }

        function canliRefleksDinle() {
            _supabase
                .channel('public:refleks_skorlari')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'refleks_skorlari' }, payload => {
                    refleksSkorlariniGetir();
                })
                .subscribe();
        }
    </script>

</body>
</html>
